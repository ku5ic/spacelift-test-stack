---
- name: Exercise Spacelift's native Ansible vendor against the foundation stack's AWS resources
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    bucket_name: "{{ lookup('env', 'FOUNDATION_BUCKET_NAME') }}"
    aws_region: "{{ lookup('env', 'TF_VAR_aws_region') | default('eu-west-1', true) }}"

  tasks:
    - name: Fail fast if the bucket name did not arrive via the stack dependency
      ansible.builtin.fail:
        msg: >-
          FOUNDATION_BUCKET_NAME is empty. Check the spacelift_stack_dependency_reference
          in meta/dependencies.tf and confirm the foundation stack has a completed
          tracked run with an apply phase.
      when: bucket_name | length == 0

    - name: Write a marker object into the foundation bucket
      amazon.aws.s3_object:
        bucket: "{{ bucket_name }}"
        object: "ansible-config/marker.txt"
        content: "written by the ansible-config stack via amazon.aws, proving the foundation -> ansible stack dependency and the native Ansible vendor both work"
        mode: put
        region: "{{ aws_region }}"

    - name: Read back the foundation SSM parameter to prove read access
      ansible.builtin.set_fact:
        ssm_value: "{{ lookup('amazon.aws.ssm_parameter', '/sk-spacelift-test/foundation/bucket_name', region=aws_region) }}"
      ignore_errors: true

    - name: Report what was read
      ansible.builtin.debug:
        msg: "SSM parameter value: {{ ssm_value | default('not found') }}"

    # The tasks below exercise the Spacelift task Diff view, one per backend diff shape.
    # Each one stands alone because planning runs in --check mode and writes nothing.
    - name: Raise the log level (single diff, text content)
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/files/app.conf"
        regexp: "^log_level"
        line: "log_level = debug"

    - name: Touch a marker file (single diff, object sides)
      ansible.builtin.file:
        path: /tmp/diff-demo-marker
        state: touch
        modification_time: preserve
        access_time: preserve

    - name: Rewrite the config and tighten its mode (plural diff, content and attributes)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/files/app.conf"
        content: |
          [server]
          port = 9090
          log_level = debug
        mode: "0600"

    - name: Write one file per environment (looped diff)
      ansible.builtin.copy:
        dest: "/tmp/diff-demo-{{ item }}.env"
        content: "ENVIRONMENT={{ item }}\n"
        mode: "0644"
      loop:
        - staging
        - production
